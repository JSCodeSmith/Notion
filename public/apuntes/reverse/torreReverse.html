<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>LEGO Cyber Lab</title><style>@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{display:flex;justify-content:center;align-items:center;height:100vh;background:#050505;font-family:'Syne',sans-serif;color:#fff;overflow:hidden;background-image:radial-gradient(circle at 15% 50%, rgba(255, 0, 128, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15), transparent 25%), radial-gradient(circle at 50% 80%, rgba(138, 43, 226, 0.15), transparent 25%)}.glass-panel{display:flex;gap:40px;background:rgba(20,20,25,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:40px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);position:relative}.left-side{display:flex;flex-direction:column;align-items:center;gap:30px}.header-modern{display:flex;align-items:center;gap:15px}.lego-badge{background:linear-gradient(90deg,#ff0055,#ff00aa);color:#fff;font-weight:800;font-size:26px;padding:6px 16px;border-radius:8px;letter-spacing:2px;box-shadow:0 0 20px rgba(255,0,85,0.6);transform:skewX(-10deg);font-family:'Syne',sans-serif}.title-text{font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}.stage{background:rgba(0,0,0,0.4);padding:40px;border-radius:20px;border:1px solid rgba(255,255,255,0.05);box-shadow:inset 0 0 30px rgba(0,0,0,0.8);position:relative;perspective:1200px;overflow:hidden}.stage::before{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top, rgba(0,255,255,0.1), transparent);pointer-events:none}.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;transform-style:preserve-3d;position:relative;z-index:10}.block-wrapper{position:relative;transform-style:preserve-3d;transition:all 0.8s cubic-bezier(0.19, 1, 0.22, 1)}.block-wrapper.flipping{transform:rotateY(180deg) scale(0.8) translateZ(100px);opacity:0.3;filter:blur(5px)}.lego-block{width:180px;height:65px;border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:32px;font-weight:800;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.8);position:relative;border:2px solid rgba(255,255,255,0.4);box-shadow:inset 0 0 20px rgba(255,255,255,0.5), inset 0 -5px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.4);transition:transform 0.2s, box-shadow 0.2s}.lego-block::before{content:'';position:absolute;top:-10px;left:15px;width:22px;height:22px;border-radius:50%;background:inherit;box-shadow:inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 4px 0 rgba(255,255,255,0.6), 45px 0 0 inherit, 90px 0 0 inherit, 135px 0 0 inherit;z-index:-1}.lego-block::after{content:'';position:absolute;top:-10px;left:15px;width:22px;height:10px;border-radius:50% 50% 0 0;background:rgba(255,255,255,0.6);box-shadow:45px 0 0 rgba(255,255,255,0.6), 90px 0 0 rgba(255,255,255,0.6), 135px 0 0 rgba(255,255,255,0.6);z-index:-1}.block-wrapper.landing .lego-block{animation:bounce 0.5s cubic-bezier(0.28, 0.84, 0.42, 1)}@keyframes bounce{0%{transform:translateY(-20px) scale(1.05);box-shadow:0 0 30px rgba(255,255,255,0.8)}50%{transform:translateY(5px) scale(0.98)}100%{transform:translateY(0) scale(1)}}.btn-cyber{background:linear-gradient(90deg,#00f0ff,#0055ff);color:#000;border:none;padding:18px 50px;font-size:18px;font-weight:800;font-family:'Syne',sans-serif;border-radius:50px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px;box-shadow:0 0 30px rgba(0,240,255,0.4), inset 0 -4px 0 rgba(0,0,0,0.2);position:relative;overflow:hidden}.btn-cyber::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(transparent,rgba(255,255,255,0.4),transparent);transform:rotate(45deg);transition:0.5s}.btn-cyber:hover:enabled::after{left:100%}.btn-cyber:hover:enabled{transform:translateY(-3px) scale(1.02);box-shadow:0 0 50px rgba(0,240,255,0.8), inset 0 -4px 0 rgba(0,0,0,0.2)}.btn-cyber:active:enabled{transform:translateY(1px)}.btn-cyber:disabled{background:#333;color:#666;box-shadow:none;cursor:not-allowed;transform:none}.right-side{display:flex;flex-direction:column;gap:20px;width:450px}.terminal-window{background:#09090b;border-radius:16px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 40px rgba(0,0,0,0.5);overflow:hidden;font-family:'Space Mono',monospace}.terminal-header{background:rgba(255,255,255,0.05);padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.05)}.terminal-dot{width:12px;height:12px;border-radius:50%}.terminal-dot.red{background:#ff5f56;box-shadow:0 0 10px #ff5f56}.terminal-dot.yellow{background:#ffbd2e;box-shadow:0 0 10px #ffbd2e}.terminal-dot.green{background:#27c93f;box-shadow:0 0 10px #27c93f}.terminal-title{color:#888;font-size:12px;margin-left:10px;letter-spacing:1px}.terminal-body{padding:20px;font-size:14px;line-height:1.8;color:#e0e0e0}.code-line{margin-bottom:8px}.token-keyword{color:#ff0055}.token-string{color:#00f0ff}.token-function{color:#8a2be2}.token-comment{color:#555}.console-output{background:#000;padding:20px;border-radius:12px;border:1px solid rgba(0,255,255,0.2);font-family:'Space Mono',monospace;font-size:13px;height:200px;overflow-y:auto;box-shadow:inset 0 0 20px rgba(0,255,255,0.05)}.console-entry{margin-bottom:8px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,0.02);padding-bottom:4px}.log-system{color:#555}.log-action{color:#ffbd2e}.log-success{color:#27c93f;text-shadow:0 0 5px rgba(39,201,63,0.5)}.log-array{color:#00f0ff;font-weight:bold}.log-error{color:#ff5f56;text-shadow:0 0 5px rgba(255,95,86,0.5)}</style></head><body><div class="glass-panel"><div class="left-side"><div class="header-modern"><div class="lego-badge">LEGO</div><div class="title-text">CYBER REVERSE</div></div><div class="stage"><div class="tower" id="tower"></div></div><button class="btn-cyber" id="btnReverse" onclick="executeReverse()">Iniciar Hackeo</button></div><div class="right-side"><div class="terminal-window"><div class="terminal-header"><div class="terminal-dot red"></div><div class="terminal-dot yellow"></div><div class="terminal-dot green"></div><div class="terminal-title">main.js</div></div><div class="terminal-body"><div class="code-line"><span class="token-keyword">let</span> torre = [<span class="token-string" id="arrayOrig">'M', 'A', 'R', 'V', 'E', 'L'</span>];</div><div class="code-line"><span class="token-comment">// Ejecutando reverse + shuffle...</span></div><div class="code-line"><span class="token-function">torre.reverse</span>();</div><div class="code-line"><span class="token-function">shuffle</span>(torre);</div><div class="code-line" style="margin-top:15px"><span class="token-comment">// Mutación exitosa:</span></div><div class="code-line"><span class="token-string" id="arrayRes">['L', 'E', 'V', 'R', 'A', 'M']</span></div></div></div><div class="console-output" id="console"></div></div></div><script>let arr=['M','A','R','V','E','L'],isAnimating=false;const colors=['#ff0055','#00f0ff','#ffcc00','#ff00aa','#8a2be2','#00ff88'];const towerEl=document.getElementById('tower'),btn=document.getElementById('btnReverse'),consoleEl=document.getElementById('console'),arrOrig=document.getElementById('arrayOrig'),arrRes=document.getElementById('arrayRes');const log=(msg,cls='log-system')=>{const d=document.createElement('div');d.className=`console-entry ${cls}`;d.innerHTML=`> ${msg}`;consoleEl.appendChild(d);consoleEl.scrollTop=consoleEl.scrollHeight;};const renderTower=()=>{towerEl.innerHTML=arr.map((l,i)=>{const color=colors[i%colors.length];return `<div class="block-wrapper" id="w-${i}"><div class="lego-block" style="background:linear-gradient(135deg, ${color}, #111); border-color:${color}; box-shadow:inset 0 0 20px rgba(255,255,255,0.5), inset 0 -5px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.4), 0 0 15px ${color}">${l}</div></div>`}).join('')};const shuffle=(a)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}};window.executeReverse=()=>{if(isAnimating)return;isAnimating=true;btn.disabled=true;const wrappers=document.querySelectorAll('.block-wrapper');wrappers.forEach(w=>w.classList.add('flipping'));log(`Iniciando protocolo reverse()...`,'log-action');log(`Datos actuales: [${arr.join(', ')}]`,'log-array');setTimeout(()=>{arr.reverse();if(arr.join('')==='MARVEL'){shuffle(arr);log(`¡Bucle detectado! Aplicando shuffle() para desorden infinito.`,'log-error')}else{shuffle(arr);log(`reverse() exitoso. Mutación aplicada.`,'log-success')}arrOrig.innerText=arr.map(l=>`'${l}'`).join(', ');arrRes.innerText=arr.map(l=>`'${l}'`).join(', ');renderTower();const newWrappers=document.querySelectorAll('.block-wrapper');newWrappers.forEach((w,i)=>{setTimeout(()=>{w.classList.add('landing');setTimeout(()=>w.classList.remove('landing'),500)},i*80)})},800);setTimeout(()=>{isAnimating=false;btn.disabled=false;log('Sistema listo. Esperando input...','log-system')},2200)};log('Iniciando sistema LEGO Cyber Reverse...','log-system');log('Cargando módulos [M, A, R, V, E, L]','log-system');renderTower();</script></body></html>
