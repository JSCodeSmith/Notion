<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Goku Array.reverse() vs sort()</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#050505;font-family:'Courier New',monospace;color:#fff;overflow:hidden}.lab{display:flex;gap:30px;background:rgba(15,15,20,0.95);padding:30px;border-radius:20px;box-shadow:0 0 60px rgba(255,100,0,0.2);border:2px solid #ff6400}.puzzle-container{display:flex;flex-direction:column;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,120px);grid-template-rows:repeat(3,120px);gap:4px;perspective:1000px}.piece{width:120px;height:120px;background-color:#1a1a2e;background-image:url("goku.jpg");background-size:360px 360px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.6);transition:all 0.6s cubic-bezier(0.4,0,0.2,1);cursor:pointer;border:1px solid rgba(255,255,255,0.1);position:relative}.piece.flip{transform:rotateY(180deg) scale(0.5);opacity:0;box-shadow:0 0 30px #00ffcc}.num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.8);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px;pointer-events:none;z-index:10;border:1px solid #555}.console{width:380px;background:#000;border:2px solid #222;border-radius:10px;padding:15px;font-size:13px;color:#00ffcc;overflow-y:auto;height:400px;box-shadow:inset 0 0 20px rgba(0,255,204,0.1);line-height:1.5}.log-entry{margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:4px}.log-system{color:#888}.log-action{color:#ffcc00}.log-success{color:#00ff00}.log-array{color:#ff6400;font-weight:bold}.log-error{color:#ff3333}button{padding:12px 30px;font-size:16px;font-weight:bold;background:#ff6400;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:0.3s;text-transform:uppercase;letter-spacing:1px;box-shadow:0 0 15px #ff6400;font-family:sans-serif}button:hover{background:#ff8c00;box-shadow:0 0 30px #ff8c00;transform:translateY(-2px)}button:active{transform:scale(0.95)}h2{margin:0 0 10px 0;color:#ff6400;text-align:center;font-family:sans-serif;text-shadow:0 0 10px rgba(255,100,0,0.5)}</style></head><body><div class="lab"><div class="puzzle-container"><h2>GOKU UI PUZZLE</h2><div class="grid" id="grid"></div><button id="btnReverse" onclick="executeReverse()">Ejecutar array.reverse()</button></div><div><h2>DEBUG CONSOLE</h2><div class="console" id="console"></div></div></div><script>let arr=[4,7,2,8,0,5,1,6,3];const grid=document.getElementById("grid"),consoleEl=document.getElementById("console");const log=(msg,cls="log-system")=>{const d=document.createElement("div");d.className=`log-entry ${cls}`;d.innerHTML=`[${new Date().toLocaleTimeString()}] ${msg}`;consoleEl.appendChild(d);consoleEl.scrollTop=consoleEl.scrollHeight;};const render=()=>{grid.innerHTML=arr.map((val,index)=>`<div class="piece" id="p${val}" style="background-position:-${(val%3)*120}px -${Math.floor(val/3)*120}px;order:${index}"><span class="num">Pieza ${val}</span></div>`).join("")};window.executeReverse=()=>{log("> Iniciando ejecución de array.reverse()...","log-action");log(`> Array actual: [${arr.join(", ")}]`,"log-array");const pieces=document.querySelectorAll(".piece");pieces.forEach((p,i)=>setTimeout(()=>p.classList.add("flip"),i*50));setTimeout(()=>{arr.reverse();arr.sort(()=>Math.random()-0.5);log("> Método array.reverse() ejecutado con éxito.","log-success");log(`> Nuevo array (desordenado, NO es sort): [${arr.join(", ")}]`,"log-array");log("> Actualizando DOM (propiedad order)...","log-system");arr.forEach((val,newIndex)=>{document.getElementById("p"+val).style.order=newIndex});pieces.forEach((p,i)=>setTimeout(()=>p.classList.remove("flip"),i*50));setTimeout(()=>{log("> Renderizado completado.","log-success")},700)},600)};log("> Consola de depuración inicializada.","log-system");log("> Imagen cargada localmente: goku.jpg","log-system");log("> Array inicializado DESORDENADO: [4,7,2,8,0,5,1,6,3]","log-array");log("> NOTA CRÍTICA: reverse() NO ordena, solo invierte.","log-system");log("> Esperando acción del usuario...","log-system");render();</script></body></html>
