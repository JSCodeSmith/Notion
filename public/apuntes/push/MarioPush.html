<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Goku Infinite Runner - AI Console</title><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{display:flex;justify-content:center;align-items:center;height:100vh;background:#050a05;font-family:'Outfit',sans-serif;color:#fff;overflow:hidden;background-image:radial-gradient(circle at 50% 50%, #0a1a0a 0%, #000 100%)}.game-wrapper{display:flex;flex-direction:column;width:min(1400px,96vw);background:rgba(10,15,10,0.95);backdrop-filter:blur(10px);border-radius:20px;border:1px solid #2a5a2a;box-shadow:0 0 50px rgba(0,255,100,0.1), inset 0 0 20px rgba(0,0,0,0.8);overflow:hidden}.ui-top{display:flex;justify-content:space-between;padding:15px 20px;background:rgba(0,0,0,0.6);border-bottom:1px solid #2a5a2a;z-index:10}.stat{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}.bar-bg{width:120px;height:12px;background:#111;border-radius:6px;overflow:hidden;border:1px solid #333}.bar-fill{height:100%;transition:width 0.3s}.hp-fill{background:linear-gradient(90deg,#ff0055,#ff5500);width:100%}.hunger-fill{background:linear-gradient(90deg,#ffcc00,#ff8800);width:100%}.score-val{color:#00ffcc;font-weight:800;text-shadow:0 0 10px #00ffcc}.game-area{position:relative;width:100%;height:450px;background:linear-gradient(180deg,#1a2a4a 0%,#2a4a6a 40%,#1a5a1a 40%,#0a2a0a 100%);overflow:hidden}.cloud{position:absolute;background:rgba(255,255,255,0.1);border-radius:50%;filter:blur(5px)}.goku{position:absolute;width:60px;height:70px;display:flex;align-items:flex-end;justify-content:center;font-size:52px;line-height:1;bottom:0;left:100px;z-index:10;transition:transform 0.1s;filter:drop-shadow(0 0 10px rgba(0,255,255,0.5))}.goku::before{content:'🦸'}.goku.invincible{opacity:0.5;animation:blink 0.1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}.obstacle{position:absolute;bottom:0;font-size:45px;z-index:5;user-select:none;filter:drop-shadow(0 5px 5px rgba(0,0,0,0.8))}.food{position:absolute;font-size:35px;z-index:5;animation:float 2s infinite ease-in-out;user-select:none;filter:drop-shadow(0 0 10px rgba(255,255,0,0.8))}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.ground{position:absolute;bottom:0;width:100%;height:20px;background:#0a1a0a;border-top:2px solid #2E8B57;z-index:1}.platform{position:absolute;background:#3a2a1a;border-top:6px solid #228B22;border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);z-index:2}.debug-console{height:220px;background:#050505;border-top:2px solid #00ffcc;padding:15px;font-family:'JetBrains Mono',monospace;font-size:12px;overflow-y:auto;line-height:1.6;color:#c9d1d9;box-shadow:inset 0 10px 20px rgba(0,0,0,0.8)}.log-system{color:#8b949e}.log-action{color:#d29922}.log-success{color:#3fb950}.log-array{color:#58a6ff;font-weight:bold}.log-error{color:#f85149}.log-ai{color:#a371f7;font-weight:bold;text-shadow:0 0 5px rgba(163,113,247,0.5)}.log-physics{color:#39c5cf}.game-over{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(5px)}.game-over h1{color:#ff0055;font-size:50px;margin-bottom:20px;text-shadow:0 0 30px #ff0055;font-weight:800}.game-over p{font-size:20px;margin-bottom:30px;font-family:'JetBrains Mono'}.btn-restart{padding:15px 50px;background:linear-gradient(90deg,#00ffcc,#0055ff);color:#000;font-weight:800;font-size:18px;border:none;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 0 20px rgba(0,255,204,0.5);text-transform:uppercase;letter-spacing:2px}.btn-restart:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(0,255,204,0.8)}</style></head><body><div class="game-wrapper"><div class="ui-top"><div class="stat"><span>❤️ VIDA:</span><div class="bar-bg"><div class="bar-fill hp-fill" id="hpFill"></div></div></div><div class="stat"><span>🍖 HAMBRE:</span><div class="bar-bg"><div class="bar-fill hunger-fill" id="hungerFill"></div></div></div><div class="stat"><span>🎒 MOCHILA (push):</span><span class="score-val" id="mochilaCount">0</span></div><div class="stat"><span>PUNTOS:</span><span class="score-val" id="score">0</span></div><div class="stat"><span>DISTANCIA:</span><span class="score-val" id="distance">0m</span></div></div><div class="game-area" id="gameArea"><div class="ground"></div><div class="goku" id="goku"></div><div class="game-over" id="gameOver"><h1>💀 GAME OVER</h1><p id="gameOverReason">Te has quedado sin vida o hambre.</p><button class="btn-restart" onclick="restartGame()">Reintentar</button></div></div><div class="debug-console" id="console"></div></div><script>const gameArea=document.getElementById('gameArea'),gokuEl=document.getElementById('goku'),hpFill=document.getElementById('hpFill'),hungerFill=document.getElementById('hungerFill'),mochilaCountEl=document.getElementById('mochilaCount'),scoreEl=document.getElementById('score'),distanceEl=document.getElementById('distance'),consoleEl=document.getElementById('console'),gameOverEl=document.getElementById('gameOver');let goku={x:100,y:0,vy:0,w:60,h:70,hp:100,hunger:100,isGrounded:true,invincible:false},keys={},mochila=[],obstacles=[],foods=[],platforms=[],score=0,distance=0,gameActive=true,lastTime=0,spawnTimer=0,hungerTimer=0,aiTimer=0,fps=60,frames=0,lastFpsTime=0,cameraX=0;const log=(msg,cls='log-system')=>{const d=document.createElement('div');d.className=`log-entry ${cls}`;d.innerHTML=`> ${msg}`;consoleEl.appendChild(d);consoleEl.scrollTop=consoleEl.scrollHeight;if(consoleEl.children.length>50)consoleEl.removeChild(consoleEl.firstChild);};const spawnClouds=()=>{for(let i=0;i<10;i++){const c=document.createElement('div');c.className='cloud';c.style.width=`${Math.random()*100+50}px`;c.style.height=`${Math.random()*40+20}px`;c.style.top=`${Math.random()*150}px`;c.style.left=`${Math.random()*1000}px`;gameArea.appendChild(c);}};const generatePlatform=()=>{const lastX=platforms.length>0?platforms[platforms.length-1].x:0;const newX=lastX+Math.random()*200+150;const newY=Math.random()*150+50;const newW=Math.random()*100+80;const p={x:newX,y:newY,w:newW,h:20};platforms.push(p);const el=document.createElement('div');el.className='platform';el.style.left=`${p.x}px`;el.style.bottom=`${p.y}px`;el.style.width=`${p.w}px`;el.style.height=`${p.h}px`;gameArea.appendChild(el);p.el=el;};const spawnEntity=()=>{if(!gameActive)return;const isObstacle=Math.random()>0.5;const spawnX=cameraX+520+Math.random()*180;if(isObstacle){const el=document.createElement('div');el.className='obstacle';el.innerText=Math.random()>0.5?'🌵':'🍄';el.style.left=`${spawnX}px`;el.style.bottom='0';const obs={el,x:spawnX,w:45,h:45,y:0};obstacles.push(obs);gameArea.appendChild(el);}else{const el=document.createElement('div');el.className='food';el.innerText=['🍎','🍖','🍉','🥕','🍕'][Math.floor(Math.random()*5)];const spawnY=Math.random()*200+50;el.style.left=`${spawnX}px`;el.style.bottom=`${spawnY}px`;const food={el,x:spawnX,y:spawnY,w:35,h:35,type:el.innerText};foods.push(food);gameArea.appendChild(el);}};const updatePhysics=(dt)=>{if(!gameActive)return;const speed=350;if(keys['ArrowRight']){goku.x+=speed*dt;gokuEl.style.transform='scaleX(1)'}if(keys['ArrowLeft']){goku.x-=speed*dt;gokuEl.style.transform='scaleX(-1)'}if(keys['ArrowUp']&&goku.isGrounded){goku.vy=800;goku.isGrounded=false}const viewX=goku.x-cameraX;if(viewX>500){cameraX=goku.x-500;}if(viewX<200){cameraX=goku.x-200;}if(cameraX<0)cameraX=0;goku.vy-=2800*dt;goku.y+=goku.vy*dt;goku.isGrounded=false;if(goku.y<=0){goku.y=0;goku.vy=0;goku.isGrounded=true;}platforms.forEach(p=>{const screenX=p.x-cameraX;if(goku.x<p.x+p.w&&goku.x+goku.w>p.x){if(goku.vy<=0&&goku.y<=p.y+p.h&&goku.y+goku.h>p.y){goku.y=p.y+p.h;goku.vy=0;goku.isGrounded=true;}else if(goku.vy>0&&goku.y+goku.h>=p.y&&goku.y<p.y){goku.vy=0;}}});gokuEl.style.left=`${goku.x-cameraX}px`;gokuEl.style.bottom=`${goku.y}px`;distance=Math.max(distance,Math.floor(goku.x/10));distanceEl.innerText=`${distance}m`;};const checkCollisions=()=>{for(let i=obstacles.length-1;i>=0;i--){const obs=obstacles[i];if(goku.x<obs.x+obs.w&&goku.x+goku.w>obs.x&&goku.y<obs.y+obs.h&&goku.y+goku.h>obs.y){if(!goku.invincible){goku.hp-=25;log(`💥 [COLISIÓN] Daño crítico recibido: -25 HP. Entidad: ${obs.el.innerText}`,'log-error');goku.invincible=true;gokuEl.classList.add('invincible');setTimeout(()=>{goku.invincible=false;gokuEl.classList.remove('invincible')},1000);if(goku.hp<=0)endGame('Tu vida llegó a 0.')}}}for(let i=foods.length-1;i>=0;i--){const f=foods[i];if(goku.x<f.x+f.w&&goku.x+goku.w>f.x&&goku.y<f.y+f.h&&goku.y+goku.h>f.y){mochila.push(f.type);log(`[ARRAY] mochila.push('${f.type}') → Longitud actual: ${mochila.length}`,'log-action');log(`[ARRAY] Estado: [${mochila.join(', ')}]`,'log-array');log(`[AI] Memoria del array calculada: ~${(mochila.length*16)} bytes.`,'log-ai');goku.hunger=Math.min(100,goku.hunger+30);score+=20;foods.splice(i,1);f.el.remove();}}};const updateEntities=(dt)=>{for(let i=obstacles.length-1;i>=0;i--){obstacles[i].x-=0;obstacles[i].el.style.left=`${obstacles[i].x-cameraX}px`;if(obstacles[i].x<cameraX-100){obstacles[i].el.remove();obstacles.splice(i,1)}}for(let i=foods.length-1;i>=0;i--){foods[i].x-=0;foods[i].el.style.left=`${foods[i].x-cameraX}px`;if(foods[i].x<cameraX-100){foods[i].el.remove();foods.splice(i,1)}}for(let i=platforms.length-1;i>=0;i--){platforms[i].el.style.left=`${platforms[i].x-cameraX}px`;if(platforms[i].x+platforms[i].w<cameraX-100){platforms[i].el.remove();platforms.splice(i,1)}}};const gameLoop=(time)=>{if(!gameActive)return;let dt=(time-lastTime)/1000;if(dt>0.1)dt=0.1;lastTime=time;frames++;if(time-lastFpsTime>=1000){fps=frames;frames=0;lastFpsTime=time;}updatePhysics(dt);updateEntities(dt);checkCollisions();const rightmostPlatform=platforms.length>0?platforms[platforms.length-1].x:0;if(rightmostPlatform<cameraX+1200){generatePlatform();}spawnTimer+=dt;if(spawnTimer>1.2){spawnEntity();spawnTimer=0}hungerTimer+=dt;if(hungerTimer>1){goku.hunger-=1.5;if(goku.hunger<0)goku.hunger=0;if(goku.hunger<=0){goku.hp-=5;if(goku.hp<=0)endGame('Te moriste de hambre.')}hungerTimer=0;hpFill.style.width=`${Math.max(0,goku.hp)}%`;hungerFill.style.width=`${Math.max(0,goku.hunger)}%`;mochilaCountEl.innerText=mochila.length;scoreEl.innerText=score;}aiTimer+=dt;if(aiTimer>3){aiTimer=0;const msgs=["[AI] Analizando entropía del terreno... OK.","[AI] Optimizando ciclo de renderizado.","[AI] Escaneando bioma: Plantas Verdes detectadas.","[AI] Alerta de inanición en "+(100-goku.hunger).toFixed(0)+"%",'[PHYSICS] FPS: '+fps+' | Velocidad Y: '+goku.vy.toFixed(1)];log(msgs[Math.floor(Math.random()*msgs.length)],'log-ai');}requestAnimationFrame(gameLoop)};const endGame=(reason)=>{gameActive=false;gameOverEl.style.display='flex';document.getElementById('gameOverReason').innerText=reason;log(`💀 [CRITICAL] GAME OVER: ${reason}`,'log-error');};window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener('keyup',e=>{keys[e.key]=false});window.restartGame=()=>{goku={x:100,y:0,vy:0,w:60,h:70,hp:100,hunger:100,isGrounded:true,invincible:false};mochila=[];obstacles.forEach(o=>o.el.remove());foods.forEach(f=>f.el.remove());platforms.forEach(p=>p.el.remove());obstacles=[];foods=[];platforms=[];score=0;distance=0;cameraX=0;gameActive=true;spawnTimer=0;hungerTimer=0;aiTimer=0;lastTime=performance.now();gameOverEl.style.display='none';consoleEl.innerHTML='';log('Inicializando Motor Físico...','log-system');log('Generando terreno procedural...','log-system');log('Conexión con IA de Depuración establecida.','log-ai');spawnClouds();for(let i=0;i<4;i++)generatePlatform();for(let i=0;i<4;i++)spawnEntity();hpFill.style.width='100%';hungerFill.style.width='100%';mochilaCountEl.innerText='0';scoreEl.innerText='0';distanceEl.innerText='0m';requestAnimationFrame(gameLoop)};restartGame();</script></body></html>
