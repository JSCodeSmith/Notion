<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Flujo: find, filter, findIndex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0d1117;
            --bg-panel: #161b22;
            --bg-node: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            
            --color-find: #58a6ff;
            --color-filter: #3fb950;
            --color-findindex: #d2a8ff;
            
            --font-ui: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-ui);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Controles para filtrar el diagrama */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            background: var(--bg-panel);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { color: var(--text-main); background: var(--bg-node); }
        
        .btn.active[data-target="all"] { border-color: var(--text-muted); color: #fff; }
        .btn.active[data-target="find"] { border-color: var(--color-find); color: var(--color-find); background: rgba(88, 166, 255, 0.1); }
        .btn.active[data-target="filter"] { border-color: var(--color-filter); color: var(--color-filter); background: rgba(63, 185, 80, 0.1); }
        .btn.active[data-target="findindex"] { border-color: var(--color-findindex); color: var(--color-findindex); background: rgba(210, 168, 255, 0.1); }

        /* Contenedor del diagrama */
        .diagram-container {
            position: relative;
            width: 900px;
            height: 700px;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        /* SVG para las líneas de conexión */
        svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        path {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 2;
            transition: stroke 0.4s, opacity 0.4s, filter 0.4s;
        }
        path.dimmed { opacity: 0.2; }
        
        /* Colores de las líneas al activarse */
        .path-find { stroke: var(--color-find); filter: drop-shadow(0 0 5px rgba(88,166,255,0.5)); }
        .path-filter { stroke: var(--color-filter); filter: drop-shadow(0 0 5px rgba(63,185,80,0.5)); }
        .path-findindex { stroke: var(--color-findindex); filter: drop-shadow(0 0 5px rgba(210,168,255,0.5)); }
        .path-common { stroke: var(--text-main); filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }

        /* Marcadores de flechas */
        marker { fill: var(--border-color); }
        marker.active-marker { fill: var(--text-main); }

        /* Nodos del diagrama */
        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.9rem;
            width: 180px;
            z-index: 10;
            transition: all 0.4s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .node.dimmed { opacity: 0.3; border-color: var(--border-color); }

        /* Nodos de Decisión (Rombos) */
        .node.decision {
            width: 160px; height: 110px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: flex; align-items: center; justify-content: center;
            border-radius: 0; padding: 0; font-size: 0.85rem; background: var(--bg-node);
        }
        .node.decision::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--border-color); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); z-index: -1;
            transition: background 0.4s;
        }
        .node.decision::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: var(--bg-panel); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); z-index: -1;
        }
        .node.decision.dimmed::before { background: var(--border-color); }

        /* Resaltados de nodos */
        .node.highlight-find { border-color: var(--color-find); color: var(--color-find); box-shadow: 0 0 15px rgba(88,166,255,0.3); }
        .node.highlight-find.decision::before { background: var(--color-find); }

        .node.highlight-filter { border-color: var(--color-filter); color: var(--color-filter); box-shadow: 0 0 15px rgba(63,185,80,0.3); }
        .node.highlight-filter.decision::before { background: var(--color-filter); }

        .node.highlight-findindex { border-color: var(--color-findindex); color: var(--color-findindex); box-shadow: 0 0 15px rgba(210,168,255,0.3); }
        .node.highlight-findindex.decision::before { background: var(--color-findindex); }

        /* Etiquetas de Sí / No */
        .label {
            position: absolute; font-size: 0.75rem; font-weight: bold; font-family: var(--font-code);
            background: var(--bg-body); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color);
            z-index: 20; transform: translate(-50%, -50%); transition: all 0.4s;
        }
        .label.dimmed { opacity: 0.3; }

    </style>
</head>
<body>

    <div class="controls">
        <button class="btn active" data-target="all" onclick="highlightPath('all')">Ver Todo</button>
        <button class="btn" data-target="find" onclick="highlightPath('find')">find()</button>
        <button class="btn" data-target="filter" onclick="highlightPath('filter')">filter()</button>
        <button class="btn" data-target="findindex" onclick="highlightPath('findindex')">findIndex()</button>
    </div>

    <div class="diagram-container">
        <svg>
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border-color)" />
                </marker>
                <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-main)" />
                </marker>
            </defs>

            <!-- 
               Coordenadas Clave:
               Start: (450, 50)
               Iter: (450, 150)
               Decision_Cond: (450, 250)
               
               True -> (Right): 600
               False -> (Left): 300
               
               Action_Filter: (700, 350) -> Loops back to Iter
               Action_Find: (600, 400)
               Action_FindIndex: (600, 500)
               
               End_Filter: (750, 250) (Wait, filter doesn't short circuit, it finishes)
               
               Let's refine layout:
               Start (450, 50)
               |
               Iter (450, 150)
               |
               Cond (450, 250)
               / \
           No /   \ Yes
             /     \
        (Left 300)  (Right 600)
            |         |
      End/Undef   Filter Action (Add to array) -> Loop back to Iter
      (150,400)      |
                  Find (Return element) -> End (900, 400)
                     |
                 FindIndex (Return index) -> End (900, 500)
            -->

            <!-- Common Start -->
            <path class="common-path" d="M 450 70 L 450 130" marker-end="url(#arrow)"/>
            <path class="common-path" d="M 450 170 L 450 230" marker-end="url(#arrow)"/>
            
            <!-- Decision No (Left) -->
            <path class="path-no" d="M 370 250 L 200 250" marker-end="url(#arrow)"/>
            <path class="path-no" d="M 200 250 L 200 350" marker-end="url(#arrow)"/>
            
            <!-- Decision Yes (Right) -->
            <path class="path-yes" d="M 530 250 L 650 250" marker-end="url(#arrow)"/>
            <path class="path-yes" d="M 650 250 L 650 310" marker-end="url(#arrow)"/>

            <!-- Filter Loop (Yes -> Action -> Iter) -->
            <path class="path-filter" d="M 650 370 L 650 450 L 800 450 L 800 150 L 530 150" marker-end="url(#arrow)"/>
            
            <!-- Find & FindIndex (Split from Filter node) -->
            <path class="path-find" d="M 580 340 L 450 340 L 450 400 L 530 400" marker-end="url(#arrow)"/>
            <path class="path-findindex" d="M 580 340 L 450 340 L 450 500 L 530 500" marker-end="url(#arrow)"/>
            
            <!-- Final Ends -->
            <path class="path-find" d="M 680 400 L 780 400" marker-end="url(#arrow)"/>
            <path class="path-findindex" d="M 680 500 L 780 500" marker-end="url(#arrow)"/>

        </svg>

        <!-- NODOS HTML -->
        <!-- Start & Iter -->
        <div class="node common-node" style="left: 450px; top: 50px;">Inicio: array.metodo()</div>
        <div class="node common-node" style="left: 450px; top: 150px;">Iterar al siguiente elemento</div>
        
        <!-- Decision -->
        <div class="node decision common-node" style="left: 450px; top: 250px;">¿Cumple la<br>condición?</div>
        
        <!-- Left Branch (False) -->
        <div class="label path-no-label" style="left: 320px; top: 230px; color: var(--accent-red);">No</div>
        <div class="node" style="left: 200px; top: 250px; font-size: 0.8rem;">¿Fin del array?</div>
        <div class="node" style="left: 200px; top: 400px;">Return (Fallo)</div>

        <!-- Right Branch (True) -->
        <div class="label path-yes-label" style="left: 580px; top: 230px; color: var(--accent-green);">Sí</div>
        
        <!-- Filter Action -->
        <div class="node node-filter" style="left: 650px; top: 350px;">
            <span style="color:var(--color-filter); font-weight:bold;">filter():</span><br>Guardar en nuevo array
        </div>

        <!-- Find Action -->
        <div class="node node-find" style="left: 600px; top: 400px;">
            <span style="color:var(--color-find); font-weight:bold;">find():</span><br>Hacer Cortocircuito
        </div>

        <!-- FindIndex Action -->
        <div class="node node-findindex" style="left: 600px; top: 500px;">
            <span style="color:var(--color-findindex); font-weight:bold;">findIndex():</span><br>Hacer Cortocircuito
        </div>

        <!-- Final End Nodes -->
        <div class="node node-find-end" style="left: 850px; top: 400px; border-color: var(--color-find);">
            Return Elemento
        </div>
        <div class="node node-findindex-end" style="left: 850px; top: 500px; border-color: var(--color-findindex);">
            Return Índice (number)
        </div>
        
        <div class="node" style="left: 800px; top: 150px; border-color: var(--color-filter); opacity: 0.8;">
            Return Nuevo Array
        </div>
        <path class="path-filter" d="M 800 170 L 800 250 L 730 250" marker-end="url(#arrow)"/> <!-- Filter to final return -->

    </div>

    <script>
        function highlightPath(type) {
            // Actualizar botones
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.btn[data-target="${type}"]`).classList.add('active');

            // Resetear todo
            document.querySelectorAll('path').forEach(p => p.classList.add('dimmed'));
            document.querySelectorAll('.node').forEach(n => {
                n.classList.add('dimmed');
                n.classList.remove('highlight-find', 'highlight-filter', 'highlight-findindex');
            });
            document.querySelectorAll('.label').forEach(l => l.classList.add('dimmed'));

            if (type === 'all') {
                document.querySelectorAll('path').forEach(p => p.classList.remove('dimmed'));
                document.querySelectorAll('.node').forEach(n => n.classList.remove('dimmed'));
                document.querySelectorAll('.label').forEach(l => l.classList.remove('dimmed'));
                return;
            }

            // Función auxiliar para iluminar
            const lightUp = (elements, colorClass) => {
                elements.forEach(el => {
                    el.classList.remove('dimmed');
                    if (colorClass) el.classList.add(colorClass);
                });
            };

            // Iluminar el camino común
            lightUp(document.querySelectorAll('.common-path, .common-node'));
            lightUp(document.querySelectorAll('.path-yes, .path-yes-label'));
            lightUp(document.querySelectorAll('.path-no, .path-no-label'), ''); // El NO y fin de array es igual para todos

            if (type === 'find') {
                lightUp(document.querySelectorAll('.path-find, .node-find, .node-find-end'), 'highlight-find');
                document.querySelectorAll('.path-find').forEach(p => p.classList.add('path-find'));
            } 
            else if (type === 'filter') {
                lightUp(document.querySelectorAll('.path-filter, .node-filter'), 'highlight-filter');
                // El filter no hace cortocircuito, vuelve al inicio
                lightUp(document.querySelectorAll('.path-filter'), 'highlight-filter');
            } 
            else if (type === 'findindex') {
                lightUp(document.querySelectorAll('.path-findindex, .node-findindex, .node-findindex-end'), 'highlight-findindex');
                document.querySelectorAll('.path-findindex').forEach(p => p.classList.add('path-findindex'));
            }
        }

        // Iniciar mostrando todo
        highlightPath('all');
    </script>
</body>
</html>
