<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Lab: array.find() (Editable)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-panel: #161b22;
            --bg-editor: #0d1117;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #d2a8ff;
            --accent-yellow: #e3b341;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            background-image: radial-gradient(#30363d 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .lab-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        /* --- ESTILOS COMUNES DE PANELES --- */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255,255,255,0.02);
        }

        /* --- PANEL IZQUIERDO: BUILDER --- */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-editor);
        }
        .tab {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab:hover { color: var(--text-main); }
        .tab.active {
            background-color: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            border-color: rgba(88, 166, 255, 0.3);
        }

        .builder-content { padding: 20px; }
        
        .array-visualizer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            min-height: 80px;
            align-content: flex-start;
        }

        .array-item {
            background-color: var(--bg-editor);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 24px 10px 14px; /* Espacio extra a la derecha para botones */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s;
            font-family: var(--font-code);
            font-size: 0.9rem;
            min-width: 70px;
        }
        .array-item .idx {
            font-size: 0.65rem;
            color: var(--text-muted);
            position: absolute;
            top: -18px;
        }

        /* Botones de Editar/Eliminar (Aparecen al pasar el ratón) */
        .item-actions {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .array-item:hover .item-actions {
            opacity: 1;
        }
        .item-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px;
            border-radius: 4px;
            filter: grayscale(1);
            transition: all 0.2s;
        }
        .item-actions button:hover {
            filter: grayscale(0);
            background-color: rgba(255,255,255,0.1);
        }
        .item-actions .btn-edit:hover { color: var(--accent-blue); }
        .item-actions .btn-delete:hover { color: var(--accent-red); }

        /* Estados de la animación */
        .array-item.evaluating {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px rgba(227, 179, 65, 0.3);
            transform: translateY(-4px);
        }
        .array-item.success {
            border-color: var(--accent-green);
            background-color: rgba(63, 185, 80, 0.1);
            box-shadow: 0 0 15px rgba(63, 185, 80, 0.4);
            transform: translateY(-4px) scale(1.05);
            color: var(--accent-green);
        }

        .add-controls {
            display: flex;
            gap: 10px;
        }
        .input-field {
            flex: 1;
            background-color: var(--bg-editor);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            outline: none;
        }
        .input-field:focus { border-color: var(--accent-blue); }
        .btn-add {
            background-color: var(--bg-editor);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover { background-color: var(--border-color); }

        /* --- PANEL DERECHO: EDITOR Y CONSOLA --- */
        .editor-header {
            display: flex;
            gap: 6px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .code-block {
            padding: 20px;
            background-color: var(--bg-editor);
            font-family: var(--font-code);
            font-size: 0.85rem;
            line-height: 1.8;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            min-height: 120px;
        }
        .code-line { display: flex; }
        .line-num { width: 20px; color: #484f58; user-select: none; margin-right: 12px; text-align: right; }
        .code-text { color: #e6edf3; }
        
        /* Syntax highlighting */
        .kw { color: #ff7b72; }
        .fn { color: var(--accent-purple); }
        .var { color: #79c0ff; }
        .val { color: #a5d6ff; }
        .prop { color: #e3b341; }
        .str { color: #a5d6ff; }

        .action-bar {
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            background-color: var(--bg-panel);
        }
        .btn-run {
            flex: 1;
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-run:hover { background-color: #2ea043; }
        .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-reset {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .console {
            padding: 20px;
            background-color: #000;
            font-family: var(--font-code);
            font-size: 0.85rem;
            height: 160px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
        }
        .log-line { margin-bottom: 6px; color: var(--text-muted); animation: fadeIn 0.3s ease-out; }
        .log-info { color: var(--text-main); }
        .log-eval { color: var(--accent-yellow); }
        .log-error { color: var(--accent-red); }
        .log-success { color: var(--accent-green); font-weight: 600; }
        .log-return { color: var(--accent-purple); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .lab-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="lab-container">
        
        <!-- PANEL IZQUIERDO: DATOS Y CONSTRUCCIÓN -->
        <div class="panel">
            <div class="panel-header">Entorno de Pruebas (Live Builder)</div>
            
            <div class="tabs" id="preset-tabs">
                <div class="tab active" onclick="loadPreset('numbers', this)">Números</div>
                <div class="tab" onclick="loadPreset('users', this)">Usuarios (Objetos)</div>
                <div class="tab" onclick="loadPreset('strings', this)">Palabras (Strings)</div>
            </div>

            <div class="builder-content">
                <div class="array-visualizer" id="array-visualizer">
                    <!-- JS inyecta los elementos -->
                </div>

                <div class="add-controls" id="add-controls">
                    <!-- Se adapta según el preset -->
                </div>
            </div>
        </div>

        <!-- PANEL DERECHO: EDITOR Y CONSOLA -->
        <div class="panel">
            <div class="panel-header">
                <div class="editor-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <span>live_find.js</span>
                <span style="color:var(--text-muted); font-size:0.75rem;">Sandbox</span>
            </div>

            <!-- Bloque de código dinámico -->
            <div class="code-block" id="code-editor">
                <!-- JS inyecta el código -->
            </div>

            <div class="action-bar">
                <button class="btn-run" id="btn-run" onclick="runFind()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Ejecutar find()
                </button>
                <button class="btn-reset" onclick="resetLab()" title="Resetear simulación">🔄</button>
            </div>

            <div class="console" id="console">
                <div class="log-line">> Esperando ejecución...</div>
            </div>
        </div>

    </div>

    <script>
        // --- ESTADO GLOBAL ---
        let currentPreset = 'numbers';
        let arrayData = [];
        let isAnimating = false;
        
        // Referencias DOM
        const visualizer = document.getElementById('array-visualizer');
        const addControls = document.getElementById('add-controls');
        const codeEditor = document.getElementById('code-editor');
        const consoleBox = document.getElementById('console');
        const btnRun = document.getElementById('btn-run');

        // --- PRESETS (EJEMPLOS VIVOS) ---
        const presets = {
            numbers: {
                data: [10, 20, 30, 40, 50],
                condition: (item) => item > 25,
                conditionStr: "n > 25",
                codeStr: `const resultado = array.find(n => n > 25);`,
                renderAddForm: () => `
                    <input type="number" id="new-item-input" class="input-field" placeholder="Añadir número...">
                    <button class="btn-add" onclick="addItem()">Añadir</button>
                `
            },
            users: {
                data: [
                    { id: 1, nombre: "Josue" },
                    { id: 2, nombre: "Ana" },
                    { id: 3, nombre: "Carlos" },
                    { id: 4, nombre: "María" }
                ],
                condition: (item) => item.id === 3,
                conditionStr: "u.id === 3",
                codeStr: `const resultado = array.find(u => u.id === 3);`,
                renderAddForm: () => `
                    <input type="text" id="new-item-input" class="input-field" placeholder="Nombre del usuario..." style="flex:2;">
                    <button class="btn-add" onclick="addItem()">Añadir Usuario</button>
                `
            },
            strings: {
                data: ["manzana", "plátano", "cereza", "sandía"],
                condition: (item) => item.length > 7,
                conditionStr: "str.length > 7",
                codeStr: `const resultado = array.find(str => str.length > 7);`,
                renderAddForm: () => `
                    <input type="text" id="new-item-input" class="input-field" placeholder="Añadir palabra...">
                    <button class="btn-add" onclick="addItem()">Añadir</button>
                `
            }
        };

        // --- FUNCIONES PRINCIPALES ---

        // 1. Cargar un preset
        function loadPreset(presetName, tabElement) {
            if (isAnimating) return;
            currentPreset = presetName;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');

            arrayData = JSON.parse(JSON.stringify(presets[presetName].data)); // Copia profunda
            addControls.innerHTML = presets[presetName].renderAddForm();

            renderArray();
            updateCode();
            resetConsole();
        }

        // 2. Renderizar el Array Visual
        function renderArray() {
            visualizer.innerHTML = '';
            arrayData.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'array-item';
                el.id = `item-${index}`;

                let content = '';
                if (currentPreset === 'numbers') {
                    content = item;
                } else if (currentPreset === 'users') {
                    content = `<span class="prop">id</span>: ${item.id}<br><span style="font-size:0.75rem; color:#8b949e;">${item.nombre}</span>`;
                } else {
                    content = `"${item}"`;
                }

                // Añadimos los botones de acción directamente en el HTML del ítem
                el.innerHTML = `
                    <span class="idx">[${index}]</span>
                    ${content}
                    <div class="item-actions">
                        <button class="btn-edit" onclick="editItem(${index})" title="Editar">✏️</button>
                        <button class="btn-delete" onclick="deleteItem(${index})" title="Eliminar">❌</button>
                    </div>
                `;
                visualizer.appendChild(el);
            });
        }

        // 3. Editar un Elemento
        function editItem(index) {
            if (isAnimating) return;
            
            let currentValue = arrayData[index];
            let newValue;

            if (currentPreset === 'numbers') {
                newValue = prompt("Editar número:", currentValue);
                if (newValue !== null && newValue.trim() !== '' && !isNaN(newValue)) {
                    arrayData[index] = parseFloat(newValue);
                }
            } else if (currentPreset === 'users') {
                newValue = prompt("Editar nombre del usuario:", currentValue.nombre);
                if (newValue !== null && newValue.trim() !== '') {
                    arrayData[index].nombre = newValue;
                }
            } else {
                newValue = prompt("Editar palabra:", currentValue);
                if (newValue !== null && newValue.trim() !== '') {
                    arrayData[index] = newValue;
                }
            }

            renderArray();
            resetConsole();
        }

        // 4. Eliminar un Elemento
        function deleteItem(index) {
            if (isAnimating) return;
            arrayData.splice(index, 1);
            renderArray();
            resetConsole();
        }

        // 5. Actualizar el Código del Editor
        function updateCode() {
            const codeStr = presets[currentPreset].codeStr;
            
            let highlighted = codeStr
                .replace('const', '<span class="kw">const</span>')
                .replace('array', '<span class="var">array</span>')
                .replace('find', '<span class="fn">find</span>')
                .replace(/\((.*?)\)/, (match, p1) => {
                    return `(${p1.replace('n', '<span class="var">n</span>').replace('u', '<span class="var">u</span>').replace('str', '<span class="var">str</span>')})`;
                });

            codeEditor.innerHTML = `
                <div class="code-line"><span class="line-num">1</span><span class="code-text"><span style="color:#8b949e;">// Buscando en el array...</span></span></div>
                <div class="code-line"><span class="line-num">2</span><span class="code-text">${highlighted}</span></div>
            `;
        }

        // 6. Añadir Elemento
        function addItem() {
            const input = document.getElementById('new-item-input');
            if (!input || !input.value) return;

            if (currentPreset === 'numbers') {
                const val = parseFloat(input.value);
                if (!isNaN(val)) arrayData.push(val);
            } else if (currentPreset === 'users') {
                const newId = arrayData.length > 0 ? Math.max(...arrayData.map(u => u.id)) + 1 : 1;
                arrayData.push({ id: newId, nombre: input.value });
            } else {
                arrayData.push(input.value);
            }

            input.value = '';
            renderArray();
            resetConsole();
        }

        // 7. Simulación de find() con animación
        async function runFind() {
            if (isAnimating || arrayData.length === 0) return;
            isAnimating = true;
            btnRun.disabled = true;
            
            resetConsole();
            addLog('> Compilando y ejecutando en un sandbox...', 'log-info');
            await sleep(600);

            const conditionFn = presets[currentPreset].condition;
            let found = false;

            for (let i = 0; i < arrayData.length; i++) {
                const item = arrayData[i];
                const el = document.getElementById(`item-${i}`);
                
                el.classList.add('evaluating');
                addLog(`> Evaluando [${i}]: ${JSON.stringify(item)}`, 'log-eval');
                await sleep(800);

                if (conditionFn(item)) {
                    el.classList.remove('evaluating');
                    el.classList.add('success');
                    addLog(`✅ Condición cumplida (${presets[currentPreset].conditionStr}). Cortocircuito.`, 'log-success');
                    addLog(`■ Retorna: ${JSON.stringify(item)}`, 'log-return');
                    found = true;
                    break; // Cortocircuito
                } else {
                    el.classList.remove('evaluating');
                    addLog(`❌ Condición fallida. Continuando...`, 'log-error');
                    await sleep(400);
                }
            }

            if (!found) {
                addLog(`❌ Fin del array. No se encontró coincidencia. Retorna: undefined`, 'log-error');
            }

            isAnimating = false;
            btnRun.disabled = false;
        }

        // --- UTILIDADES ---
        function addLog(text, className) {
            const div = document.createElement('div');
            div.className = `log-line ${className}`;
            div.innerText = text;
            consoleBox.appendChild(div);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function resetConsole() {
            consoleBox.innerHTML = '<div class="log-line">> Esperando ejecución...</div>';
            document.querySelectorAll('.array-item').forEach(el => el.classList.remove('evaluating', 'success'));
        }

        function resetLab() {
            if (isAnimating) return;
            arrayData = JSON.parse(JSON.stringify(presets[currentPreset].data));
            renderArray();
            resetConsole();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Inicialización
        loadPreset('numbers', document.querySelector('.tab.active'));

    </script>
</body>
</html>
