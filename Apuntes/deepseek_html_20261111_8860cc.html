<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Interactivo: find()</title>
    <style>
        /* Estilos idénticos a tu diseño en modo oscuro */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Editor */
        .editor-container {
            background-color: #0d1117;
            padding: 16px;
            border-bottom: 1px solid #30363d;
        }

        .code-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #010409;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-run {
            background-color: #238636;
            color: white;
        }
        .btn-run:hover { background-color: #2ea043; }
        
        .btn-reset {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-reset:hover { background-color: #30363d; }

        /* Array Visual */
        .array-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .array-item {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #8b949e;
            transition: all 0.3s;
        }

        .array-item.active {
            border-color: #58a6ff;
            background-color: rgba(88, 166, 255, 0.1);
            color: white;
        }

        .array-item.success {
            border-color: #3fb950;
            background-color: rgba(63, 185, 80, 0.15);
            color: #7ee787;
            font-weight: bold;
        }

        /* Consola */
        .console {
            padding: 16px;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            min-height: 100px;
            color: #8b949e;
        }

        .log { margin-bottom: 4px; }
        .log-error { color: #f85149; }
        .log-success { color: #3fb950; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span>▶️ Editor de Código: array.find()</span>
        </div>

        <!-- ARRAY DE DATOS (Fijo para que el usuario sepa qué manipular) -->
        <div class="array-container" id="array-visual">
            <!-- JS inyecta los elementos aquí -->
        </div>

        <!-- EDITOR DE CÓDIGO -->
        <div class="editor-container">
            <div class="code-label">Array.prototype.find()</div>
            <!-- Aquí el usuario puede escribir su código -->
            <textarea id="code-editor" spellcheck="false">const resultado = usuarios.find(u => u.id === 3);
console.log(resultado);</textarea>
        </div>

        <div class="controls">
            <button class="btn-run" onclick="ejecutarCodigo()">▶ Ejecutar</button>
            <button class="btn-reset" onclick="reiniciar()">🔄 Reset</button>
        </div>

        <div class="console" id="terminal">
            > Esperando ejecución...
        </div>
    </div>

    <script>
        // El array original que el usuario va a manipular
        const usuarios = [
            { id: 1, nombre: "Josue" },
            { id: 2, nombre: "Ana" },
            { id: 3, nombre: "Carlos" },
            { id: 4, nombre: "María" },
            { id: 5, nombre: "Pedro" }
        ];

        const editor = document.getElementById('code-editor');
        const terminal = document.getElementById('terminal');
        const arrayVisual = document.getElementById('array-visual');

        // Función para dibujar el array en pantalla
        function renderArray() {
            arrayVisual.innerHTML = '';
            usuarios.forEach((user, index) => {
                const div = document.createElement('div');
                div.className = 'array-item';
                div.id = `user-${index}`;
                div.innerHTML = `[${index}] { id: ${user.id}, nombre: "${user.nombre}" }`;
                arrayVisual.appendChild(div);
            });
        }

        // Función que escribe en la consola
        function log(text, type = '') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Reiniciar todo
        function reiniciar() {
            editor.value = `const resultado = usuarios.find(u => u.id === 3);\nconsole.log(resultado);`;
            terminal.innerHTML = '> Esperando ejecución...';
            renderArray();
        }

        // Lógica principal de ejecución
        function ejecutarCodigo() {
            terminal.innerHTML = ''; // Limpiar consola
            renderArray(); // Limpiar colores del array

            const codigoUsuario = editor.value;

            try {
                // 1. Creamos un entorno seguro para evaluar el código del usuario.
                // Le pasamos "usuarios" y "console" para que pueda usarlos.
                const ejecutar = new Function('usuarios', 'console', `
                    ${codigoUsuario}
                `);

                // 2. Interceptamos el console.log para mostrarlo en nuestra terminal visual
                const customConsole = {
                    log: (msg) => {
                        // Si el mensaje es un objeto, lo convertimos a texto
                        if (typeof msg === 'object' && msg !== null) {
                            log(`> Retorna: { id: ${msg.id}, nombre: "${msg.nombre}" }`, 'log-success');
                            
                            // ¡Magia visual! Buscamos en el array visual para iluminarlo
                            const index = usuarios.findIndex(u => u.id === msg.id);
                            if(index !== -1) {
                                document.getElementById(`user-${index}`).classList.add('success');
                            }

                        } else {
                            log(`> Retorna: ${msg}`, 'log-success');
                        }
                    },
                    error: (msg) => log(`> Error: ${msg}`, 'log-error')
                };

                // 3. Ejecutamos el código pasándole nuestros datos
                ejecutar(usuarios, customConsole);
                
                // 4. Si el usuario usó "return" en lugar de console.log, lo capturamos
                const resultadoDirecto = ejecutar(usuarios, customConsole);
                if (resultadoDirecto !== undefined) {
                     log(`> Retorna (return): ${JSON.stringify(resultadoDirecto)}`, 'log-success');
                }

            } catch (error) {
                // Si el usuario comete un error de sintaxis, lo mostramos en rojo
                log(`> Error de sintaxis: ${error.message}`, 'log-error');
            }
        }

        // Iniciar al cargar
        renderArray();
    </script>
</body>
</html>
